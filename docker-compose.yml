services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "overfoliouser", "-d", "overfoliodb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: backend
    env_file: .env
    volumes:
      - ./backend:/app # à retirer en production
      - static_data:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn overfolio.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    build:
      context: ./frontend
      target: build  # build stage only (pas besoin d'exécuter nginx ici)
    container_name: frontend
    restart: "no"
    volumes:
      - frontend-dist:/app/dist  # Expose dist pour nginx
    command: npm run build

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro  # nginx lit le dist généré
      - static_data:/staticfiles:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully

volumes:
  postgres_data:
  frontend-dist:
  static_data:

